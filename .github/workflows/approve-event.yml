
name: Approve Event

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Candidate ID to review"
        required: true
        type: string
      decision:
        description: "Editorial decision"
        required: true
        type: choice
        options:
          - hold
          - approve
          - reject
        default: hold

permissions:
  contents: write

concurrency:
  group: editorial-decisions
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record editorial decision
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DECISION: ${{ inputs.decision }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          candidates = json.loads(
              Path("candidates.json").read_text(encoding="utf-8")
          )

          candidate_id = os.environ["CANDIDATE_ID"]
          decision = os.environ["DECISION"]

          if decision not in ("approve", "reject", "hold"):
              raise SystemExit("Invalid decision.")

          match = next(
              (c for c in candidates
               if str(c.get("id")) == candidate_id),
              None
          )

          if match is None:
              raise SystemExit("Candidate not found.")

          path = Path("review-decisions.json")
          decisions = json.loads(path.read_text(encoding="utf-8"))

          decisions[candidate_id] = {
              "decision": decision,
              "title": match.get("title_raw", ""),
              "date": match.get("date_raw", ""),
              "recorded_at": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          path.write_text(
              json.dumps(decisions, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Candidate: {candidate_id}")
          print(f"Decision recorded: {decision.upper()}")
          print("Publication remains disabled.")
          PY

      - name: Commit decision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-decisions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Record editorial decision"
            git push origin HEAD:main
          fi
