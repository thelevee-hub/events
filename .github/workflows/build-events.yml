name: Build Events Site

on:
  push:
    branches:
      - main
    paths:
      - "events.json"
      - "generate.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate website and calendar
        run: python generate.py

      - name: Publish generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html calendar.ics
          git diff --cached --quiet || git commit -m "Rebuild events site"
          git push
