name: Discover Event Candidates

on:
  schedule:
    - cron: "0 10 */2 * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover event candidates
        run: python collect_events.py

      - name: Commit review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json review-report.md
          git diff --cached --quiet || git commit -m "Update event review queue"
          git push
